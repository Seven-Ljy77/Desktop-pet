name: desktop-pet

services:
  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../services/api/app/data/messages.json:/app/app/data/messages.json:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PET_DOMAIN: ${PET_DOMAIN:?Set PET_DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
