[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "desktop-pet-api"
version = "0.1.0"
description = "Dynamic interaction API for Desktop Pet"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

